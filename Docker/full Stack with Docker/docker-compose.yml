services:
  server:
    build: ./server
    ports:
      - "5000:5000"
    volumes:
      - ./server:/app
      - /app/node_modules

    command: npx nodemon -L server.js

  client:
    build: ./client
    ports:
      - "5173:5173"

    volumes:
      - ./client:/app
      - /app/node_modules

    command: npm run dev -- --host